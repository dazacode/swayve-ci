name: Release

# Publishes a GitHub Release on swayve-client carrying all three platforms,
# which is what the in-app update check reads and what the "update needed"
# screen links to. Runs here (public) instead of in swayve-client (private) so
# the three platform builds use free Actions minutes; the release itself is
# still created on swayve-client via a token scoped to that repo.
#
# Cut one by tagging swayve-client, then running this workflow:
#   git -C <swayve-client> tag v1.1.0 && git -C <swayve-client> push origin v1.1.0
#   gh workflow run Release --repo dazacode/swayve-ci -f version=v1.1.0
#
# The tag is the version. It is compiled into the build via MUSICSYNC_VERSION,
# so what the app reports about itself and what GitHub calls the release can
# never drift apart.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. v1.1.0 — must already be tagged on swayve-client'
        required: true

# Every build authenticates to swayve-client with SWAYVE_CLIENT_TOKEN, not with
# GITHUB_TOKEN, and writes nothing back to this repo. Declared here so the job's
# authority is a property of the workflow rather than of a repository setting.
permissions:
  contents: read

# Never cancel a release mid-flight; queue instead.
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
      number: ${{ steps.pick.outputs.number }}
    steps:
      - name: Pick the version
        id: pick
        run: |
          set -euo pipefail
          TAG="${{ inputs.version }}"
          case "$TAG" in
            v*) ;;
            *) echo "::error::Version must start with 'v' (got '$TAG')"; exit 1 ;;
          esac
          echo "tag=$TAG"            >> "$GITHUB_OUTPUT"
          echo "number=${TAG#v}"     >> "$GITHUB_OUTPUT"

  ios:
    name: iOS IPA
    needs: version
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dazacode/swayve-client
          token: ${{ secrets.SWAYVE_CLIENT_TOKEN }}
          ref: ${{ needs.version.outputs.tag }}
          # No step here pushes, so the PAT is not kept in .git/config where
          # everything the build runs afterwards could read it.
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build iOS (unsigned)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=MUSICSYNC_VERSION=${{ needs.version.outputs.number }} \
            --build-name=${{ needs.version.outputs.number }}

      - name: Package Runner.app into an IPA
        run: |
          set -euo pipefail
          APP="build/ios/iphoneos/Runner.app"
          test -d "$APP" || { echo "::error::$APP was not produced"; exit 1; }

          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry "Swayve-${{ needs.version.outputs.tag }}-unsigned.ipa" Payload)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ipa
          path: build/ipa/*.ipa
          if-no-files-found: error

  android:
    name: Android APK
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dazacode/swayve-client
          token: ${{ secrets.SWAYVE_CLIENT_TOKEN }}
          ref: ${{ needs.version.outputs.tag }}
          # No step here pushes, so the PAT is not kept in .git/config where
          # everything the build runs afterwards could read it.
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # Same workaround build-android.yml carries, and for the same reason:
      # flutter_inappwebview_android 1.1.3 calls
      # `getDefaultProguardFile('proguard-android.txt')`, which AGP 9 removed,
      # so Gradle fails while evaluating that subproject and the app is never
      # compiled. Fixing it in swayve-client's dependency graph is not
      # currently possible -- the fixed plugin release needs the 1.4.0-beta
      # platform interface (61 test failures) and the 6.2 beta facade drags
      # back flutter_inappwebview_linux, which is what pinning 6.1.5 removed.
      #
      # Rewritten in this runner's throwaway pub cache, touching neither
      # repository. Delete from both workflows together when upstream ships a
      # stable 1.2.0.
      - name: Patch flutter_inappwebview_android's removed ProGuard API
        run: |
          set -euo pipefail
          patched=0
          while IFS= read -r gradle_file; do
            case "$gradle_file" in */example/*) continue ;; esac
            grep -q "getDefaultProguardFile('proguard-android\.txt')" "$gradle_file" || continue
            echo "Patching $gradle_file"
            sed -i "s/getDefaultProguardFile('proguard-android\.txt')/getDefaultProguardFile('proguard-android-optimize.txt')/g" "$gradle_file"
            patched=$((patched + 1))
          done < <(find "${PUB_CACHE:-$HOME/.pub-cache}" -path '*/flutter_inappwebview_android-*/*build.gradle*' -type f)
          if [ "$patched" -eq 0 ]; then
            echo "Nothing needed patching. If upstream shipped a fixed release, delete this step." >&2
            exit 1
          fi
          echo "Patched $patched file(s)."

      # The release signing key, decoded from repository secrets.
      #
      # Before this existed CI signed every release APK with Gradle's debug
      # key, which is generated per machine — so a fresh runner produced a
      # differently signed APK every single build, and Android refused to
      # install one release over the previous one. Testers had to uninstall
      # first, losing their downloaded music, likes and pairing every time.
      # The in-app updater cannot work without a stable key, so this step is
      # load-bearing rather than a nicety.
      #
      # Hard-fails when the secret is missing. A silent fallback to debug
      # signing is precisely the failure this replaces: it produces a working
      # APK that quietly cannot be installed as an update, and nothing about
      # the build looks wrong.
      - name: Restore the release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set on this repository. Without it every build is signed with a throwaway key and cannot be installed as an update."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/swayve-release.jks
          {
            echo "storeFile=swayve-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "Keystore restored ($(stat -c%s android/app/swayve-release.jks) bytes)."

      - name: Build the APKs
        run: >
          flutter build apk --release --split-per-abi
          --dart-define=MUSICSYNC_VERSION=${{ needs.version.outputs.number }}
          --build-name=${{ needs.version.outputs.number }}

      - name: Name the APKs after the release
        run: |
          set -euo pipefail
          cd build/app/outputs/flutter-apk
          for apk in app-*-release.apk; do
            abi="${apk#app-}"
            abi="${abi%-release.apk}"
            mv "$apk" "Swayve-${{ needs.version.outputs.tag }}-$abi.apk"
          done
          ls -lh Swayve-*.apk

      # Proves the key actually reached the APK. `flutter build apk` succeeds
      # just as happily with the debug fallback in build.gradle.kts, so "the
      # build passed" says nothing about whether this release can be installed
      # over the last one.
      - name: Check the APKs carry the release signature
        run: |
          set -euo pipefail
          apksigner="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$apksigner" || { echo "::error::apksigner not found"; exit 1; }
          for apk in build/app/outputs/flutter-apk/*.apk; do
            certs="$("$apksigner" verify --print-certs "$apk")"
            echo "$apk"
            echo "$certs" | grep -iE 'certificate DN|SHA-256 digest' | sed 's/^/  /'
            if echo "$certs" | grep -qi 'CN=Android Debug'; then
              echo "::error::$apk was signed with a debug key — it cannot be installed over an existing Swayve."
              exit 1
            fi
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android
          path: build/app/outputs/flutter-apk/Swayve-*.apk
          if-no-files-found: error

  windows:
    name: Windows build
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dazacode/swayve-client
          token: ${{ secrets.SWAYVE_CLIENT_TOKEN }}
          ref: ${{ needs.version.outputs.tag }}
          # No step here pushes, so the PAT is not kept in .git/config where
          # everything the build runs afterwards could read it.
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Fetch ffmpeg
        shell: pwsh
        run: ./tool/fetch_ffmpeg.ps1

      - name: Build Windows
        run: >
          flutter build windows --release
          --dart-define=MUSICSYNC_VERSION=${{ needs.version.outputs.number }}
          --build-name=${{ needs.version.outputs.number }}

      - name: Zip the runnable folder
        shell: pwsh
        run: |
          $src = "build/windows/x64/runner/Release"
          if (-not (Test-Path $src)) { throw "$src was not produced" }
          Compress-Archive -Path "$src/*" -DestinationPath "Swayve-${{ needs.version.outputs.tag }}-windows.zip"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          path: '*.zip'
          if-no-files-found: error

  linux:
    name: Linux packages
    needs: version
    # Pinned to 22.04 rather than ubuntu-latest: flutter_inappwebview_linux's
    # WPE WebKit backend needs libwpewebkit-1.0-dev, which Ubuntu dropped from
    # its archive in 24.04 (noble) — 22.04 (jammy) still carries it in
    # universe. Move this back to ubuntu-latest if a later version of the
    # plugin drops the 1.0 API dependency.
    runs-on: ubuntu-22.04
    # Linux packaging has never run for real before — a first-run dependency
    # or GStreamer version mismatch here shouldn't take down the whole
    # release. Matches how beta 2 already tolerated Linux being handled
    # separately (it was packaged and attached by hand).
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dazacode/swayve-client
          token: ${{ secrets.SWAYVE_CLIENT_TOKEN }}
          ref: ${{ needs.version.outputs.tag }}
          # No step here pushes, so the PAT is not kept in .git/config where
          # everything the build runs afterwards could read it.
          persist-credentials: false

      - name: Install Linux build and packaging dependencies
        run: |
          sudo apt-get update
          # The runner image preinstalls LLVM 14, which brings in
          # libunwind-14(-dev) — a "slotted" package that Breaks: the plain
          # libunwind-dev libgstreamer1.0-dev depends on, so apt reports the
          # combined install below as unresolvable. Confirmed as expected
          # Ubuntu behavior, not a runner bug, by a runner-images maintainer:
          # https://github.com/actions/runner-images/issues/9546
          sudo apt-get remove -y 'libunwind-*'
          # flutter_inappwebview_linux's CMakeLists.txt checks for epoxy,
          # gtk+-3.0, a WPE WebKit, a WPE backend (WPEPlatform 2.0+ or the
          # legacy wpebackend-fdo-1.0), libwpe itself, libsecret-1 and
          # wayland-server -- read in full from upstream to install every
          # dependency it can fail on in one pass rather than one CI run per
          # missing package.
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev libstdc++-12-dev build-essential libsecret-1-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-pulseaudio \
            librsvg2-bin fakeroot rpm xvfb \
            libwpewebkit-1.0-dev libwpebackend-fdo-1.0-dev libwpe-1.0-dev \
            libepoxy-dev libwayland-dev

      - name: Install a Clang new enough for flutter_inappwebview_linux
        # jammy's own clang is 14, which does not recognize
        # -Wno-deprecated-literal-operator -- flutter_inappwebview_linux
        # passes it unconditionally and builds with -Werror, so an old clang
        # turns "unknown warning flag" into a hard build failure. Clang 18
        # (tried first) still doesn't know this flag either -- LLVM's own
        # notes put it on by default only in Clang 20 -- so this installs 20
        # directly. Via LLVM's official script rather than a PPA, exported as
        # CC/CXX so flutter build linux's own CMake invocation picks it up.
        run: |
          set -euo pipefail
          # llvm.sh is a remote script executed as root. Pin it by content: if
          # upstream changes it this fails loudly, so the new script gets read
          # before the hash is updated, rather than whatever is served that day
          # running unreviewed with root on a runner holding a checkout.
          LLVM_SH_SHA256=03878e08f47b66cc95bc4b544b0db3c6d9ce8d60e6cf2492ae357984330a9eae
          curl -fsSLo llvm.sh https://apt.llvm.org/llvm.sh
          echo "$LLVM_SH_SHA256  llvm.sh" | sha256sum -c -
          chmod +x llvm.sh
          sudo ./llvm.sh 20
          echo "CC=clang-20" >> "$GITHUB_ENV"
          echo "CXX=clang++-20" >> "$GITHUB_ENV"
          # Belt and suspenders: whichever compiler ends up building this,
          # -Wno-unknown-warning-option is Clang's own standing answer to "a
          # dependency passes a newer warning flag than this compiler knows" --
          # it downgrades an unrecognized -W flag back to a warning instead of
          # -Werror turning it fatal, without needing to have guessed the
          # exact right compiler version at all.
          echo "CFLAGS=-Wno-unknown-warning-option" >> "$GITHUB_ENV"
          echo "CXXFLAGS=-Wno-unknown-warning-option" >> "$GITHUB_ENV"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      - name: Build Linux
        run: >
          flutter build linux --release
          --dart-define=MUSICSYNC_VERSION=${{ needs.version.outputs.number }}
          --build-name=${{ needs.version.outputs.number }}

      - name: Package AppImage, .deb, .rpm
        # The packaging scripts read the version to package under from the
        # built binary's own `--version` output (see
        # tool/linux_package_common.sh's ensure_release_bundle) — and this is
        # a GtkApplication, so even printing --version and exiting requires a
        # display to register against. There is none on a headless runner
        # ("Gtk-WARNING: cannot open display"), which fails
        # g_application_register() and exits 1 before any packaging work
        # starts. xvfb-run gives it a virtual one just for these three calls.
        run: |
          set -euo pipefail
          # dist/linux/ carries prior betas' binaries in git (committed
          # release artifacts, per swayve-client's own convention) — this
          # checkout brings them along, and the packaging scripts only add
          # to that directory, never clear it. Left alone, every past
          # platform binary ships bundled into every new release.
          rm -rf dist/linux
          chmod +x tool/package_linux_*.sh
          xvfb-run -a tool/package_linux_appimage.sh
          xvfb-run -a tool/package_linux_deb.sh
          xvfb-run -a tool/package_linux_rpm.sh

      - name: List what was produced
        run: ls -lh dist/linux

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux
          path: dist/linux/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [version, ios, android, windows, linux]
    runs-on: ubuntu-latest
    # The swayve-ci release below is written with GITHUB_TOKEN, so this one job
    # needs more than the workflow's read-only default. swayve-client's release
    # is written with SWAYVE_CLIENT_TOKEN and is unaffected either way.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: List what will be published
        run: ls -lhR dist

      - name: Create the release on swayve-client
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          repository: dazacode/swayve-client
          token: ${{ secrets.SWAYVE_CLIENT_TOKEN }}
          tag_name: ${{ needs.version.outputs.tag }}
          name: Swayve ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: dist/*
          body: |
            Both halves of Swayve ${{ needs.version.outputs.tag }}: the
            computer that holds the library, and the phone that syncs from it.

            **This is the last release you install by hand.** Turn on "Check
            GitHub for updates" in Settings → About and the next one announces
            itself the moment you open the app, with a button that fetches and
            installs it: Windows and the Linux AppImage replace themselves and
            restart, Android hands the APK to the system installer, and iPhone
            opens AltStore or SideStore.

            - **Windows** — unzip and run `music_sync.exe`.
            - **Linux** — three packages, pick one: the `.AppImage` needs no
              install, runs on essentially any x86_64 distro, and is the only
              one that can update itself; the `.deb` is for Ubuntu/Debian and
              derivatives and the `.rpm` for Fedora, and both belong to your
              package manager from then on.
            - **Android** — take `arm64-v8a` unless you know otherwise; it
              covers essentially every phone still in use. You'll need "install
              unknown apps" enabled. **Uninstall any earlier beta first.**
              Every build before this one was signed with a throwaway key, so
              Android will not install this over it. That is a one-time cost:
              from here on every release installs straight over the top and
              keeps your downloads, likes and pairing.
            - **iPhone** — the IPA is unsigned; install it with Sideloadly,
              AltStore or SideStore, or re-sign it yourself. Signed with a free
              Apple ID it stops opening after seven days and has to be
              installed again. For one-tap updates, add this source in
              AltStore or SideStore:
              `https://raw.githubusercontent.com/dazacode/swayve-ci/main/swayve-source.json`

            Update both devices. If one is left behind far enough that the two
            can no longer talk, the phone will say so and point back here
            rather than failing quietly.

            Built by [swayve-ci](https://github.com/dazacode/swayve-ci).

      # Published here as well, and this is the copy that matters for
      # auto-update. `kReleaseRepo` in swayve-client names this repository
      # because the app's update check is unauthenticated and swayve-client is
      # private -- GitHub answers 404 for a private repo, which the checker
      # reads as "nothing published yet". A release that exists only on
      # swayve-client is therefore invisible to every installed copy of the
      # app. The tag is created here on the fly against this repository's own
      # HEAD; nothing reads it as a source ref, it is the anchor the release
      # and its assets hang from.
      - name: Create the release on swayve-ci, which the app checks for updates
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Swayve ${{ needs.version.outputs.tag }}
          files: dist/*
          body: |
            Both halves of Swayve ${{ needs.version.outputs.tag }}: the
            computer that holds the library, and the phone that syncs from it.

            **This is the last release you install by hand.** Turn on "Check
            GitHub for updates" in Settings → About and the next one announces
            itself the moment you open the app, with a button that fetches and
            installs it: Windows and the Linux AppImage replace themselves and
            restart, Android hands the APK to the system installer, and iPhone
            opens AltStore or SideStore.

            - **Windows** — unzip and run `music_sync.exe`.
            - **Linux** — three packages, pick one: the `.AppImage` needs no
              install, runs on essentially any x86_64 distro, and is the only
              one that can update itself; the `.deb` is for Ubuntu/Debian and
              derivatives and the `.rpm` for Fedora, and both belong to your
              package manager from then on.
            - **Android** — take `arm64-v8a` unless you know otherwise; it
              covers essentially every phone still in use. You'll need "install
              unknown apps" enabled. **Uninstall any earlier beta first.**
              Every build before this one was signed with a throwaway key, so
              Android will not install this over it. That is a one-time cost:
              from here on every release installs straight over the top and
              keeps your downloads, likes and pairing.
            - **iPhone** — the IPA is unsigned; install it with Sideloadly,
              AltStore or SideStore, or re-sign it yourself. Signed with a free
              Apple ID it stops opening after seven days and has to be
              installed again. For one-tap updates, add this source in
              AltStore or SideStore:
              `https://raw.githubusercontent.com/dazacode/swayve-ci/main/swayve-source.json`

            Update both devices. If one is left behind far enough that the two
            can no longer talk, the phone will say so and point back here
            rather than failing quietly.

            Built by [swayve-ci](https://github.com/dazacode/swayve-ci).

      # The AltStore / SideStore source, regenerated from what was just
      # published.
      #
      # iOS is the one platform where Swayve cannot install its own update —
      # there is no API for it, and a free-Apple-ID sideload has no route to
      # one. What it can do is hand the IPA's address to whatever sideloaded
      # it, and this file is the other half of that: a source AltStore and
      # SideStore poll themselves, so an iPhone is offered the new build in the
      # sideloader without anybody opening Swayve at all.
      #
      # The version written here is read out of the IPA's own Info.plist rather
      # than taken from the tag, and that is the whole reason this is a script
      # instead of a template. AltStore decides whether an update exists by
      # comparing this string with the installed app's
      # CFBundleShortVersionString; a tag-shaped string that Xcode never wrote
      # would leave every iPhone permanently one update behind, forever.
      - name: Update the AltStore source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source-repo

      - name: Write swayve-source.json
        working-directory: source-repo
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          python3 - "$GITHUB_WORKSPACE/dist" "$TAG" <<'PYTHON'
          import glob, json, os, plistlib, sys, zipfile
          from datetime import datetime, timezone

          dist, tag = sys.argv[1], sys.argv[2]

          ipas = glob.glob(os.path.join(dist, "*.ipa"))
          if not ipas:
              raise SystemExit("no IPA in the release; nothing to publish to a source")
          ipa = ipas[0]

          with zipfile.ZipFile(ipa) as archive:
              name = next(
                  entry for entry in archive.namelist()
                  if entry.count("/") == 2
                  and entry.startswith("Payload/")
                  and entry.endswith(".app/Info.plist")
              )
              info = plistlib.loads(archive.read(name))

          version = info["CFBundleShortVersionString"]
          bundle = info["CFBundleIdentifier"]
          asset = os.path.basename(ipa)
          url = f"https://github.com/dazacode/swayve-ci/releases/download/{tag}/{asset}"

          entry = {
              "version": version,
              "buildVersion": info.get("CFBundleVersion", ""),
              "date": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "localizedDescription": f"Swayve {tag}.",
              "downloadURL": url,
              "size": os.path.getsize(ipa),
              "minOSVersion": info.get("MinimumOSVersion", "13.0"),
          }

          path = "swayve-source.json"
          try:
              with open(path, encoding="utf-8") as handle:
                  source = json.load(handle)
              app = source["apps"][0]
              versions = [v for v in app.get("versions", []) if v["version"] != version]
          except (FileNotFoundError, KeyError, IndexError, json.JSONDecodeError):
              source = {
                  "name": "Swayve",
                  "identifier": "dev.seanmusic.swayve",
                  "sourceURL": "https://raw.githubusercontent.com/dazacode/swayve-ci/main/swayve-source.json",
                  "apps": [{}],
              }
              app = source["apps"][0]
              versions = []

          app.update({
              "name": "Swayve",
              "bundleIdentifier": bundle,
              "developerName": "Swayve",
              "subtitle": "Your music, on your devices.",
              "localizedDescription": (
                  "Swayve syncs a music library between a computer and a phone "
                  "over your own network. No accounts, no cloud, no streaming "
                  "service."
              ),
              "iconURL": "https://raw.githubusercontent.com/dazacode/swayve-ci/main/swayve-icon.png",
              "tintColor": "4D6BFF",
              # AltStore reads the top-level fields as "the current release"
              # and the array as the history it can roll back through.
              "version": entry["version"],
              "versionDate": entry["date"],
              "versionDescription": entry["localizedDescription"],
              "downloadURL": entry["downloadURL"],
              "size": entry["size"],
              "versions": [entry] + versions[:9],
          })
          source["apps"][0] = app

          with open(path, "w", encoding="utf-8") as handle:
              handle.write(json.dumps(source, indent=2) + chr(10))

          print(f"swayve-source.json now offers {version} ({asset})")
          PYTHON

          if git diff --quiet -- swayve-source.json; then
            echo "Source unchanged."
            exit 0
          fi
          git config user.name "swayve-ci"
          git config user.email "swayve-ci@users.noreply.github.com"
          git add swayve-source.json
          git commit -m "Offer ${TAG} to AltStore and SideStore"
          git push
