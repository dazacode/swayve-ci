name: Build iOS IPA

# Builds an unsigned .ipa by checking out the private swayve-client repo on a
# macOS runner. Lives here (public) rather than in swayve-client (private) so
# the build runs on free Actions minutes instead of billed ones — a macOS
# runner is the most expensive minute there is.
#
# Manual only — trigger after pushing to swayve-client with
#   gh workflow run "Build iOS IPA" --repo dazacode/swayve-ci -f ref=main
# Download the artifact from the run summary and install it with
# Sideloadly / AltStore, or re-sign it yourself.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'swayve-client branch, tag or commit to build'
        required: false
        default: main

# Every build authenticates to swayve-client with SWAYVE_CLIENT_TOKEN, not with
# GITHUB_TOKEN, and writes nothing back to this repo. Declared here so the job's
# authority is a property of the workflow rather than of a repository setting.
permissions:
  contents: read

# One build per ref at a time: re-dispatching supersedes the run already in
# flight instead of double-booking the macOS runner with a superseded commit.
concurrency:
  group: build-ios-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Analysis and tests are pure Dart: flutter_tester runs them on the Dart VM,
  # so nothing in them is macOS-specific. On the macOS runner they were 274s of
  # a 600s run (test 251s, analyze 23s). They run on Linux instead and gate the
  # build, so a failing test can never produce a downloadable IPA.
  # ---------------------------------------------------------------------------
  check:
    name: Analyze + test
    runs-on: ubuntu-latest

    steps:
      - name: Check out swayve-client
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: dazacode/swayve-client
          token: ${{ secrets.SWAYVE_CLIENT_TOKEN }}
          ref: ${{ inputs.ref }}
          # No step here pushes, so the PAT is not kept in .git/config where
          # everything the build runs afterwards could read it.
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Report toolchain
        run: |
          flutter --version
          flutter doctor -v

      - name: Fetch packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build:
    name: Unsigned IPA
    # Gated on `check`: the IPA is only ever built from a tree that analyzed
    # clean and passed its tests.
    needs: check
    # macos-26, not macos-15: the app icon is an Icon Composer bundle
    # (ios/Runner/AppIcon.icon) and only Xcode 26's asset catalog compiler
    # knows that format.
    runs-on: macos-26

    steps:
      - name: Check out swayve-client
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: dazacode/swayve-client
          token: ${{ secrets.SWAYVE_CLIENT_TOKEN }}
          ref: ${{ inputs.ref }}
          # No step here pushes, so the PAT is not kept in .git/config where
          # everything the build runs afterwards could read it.
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      # `flutter doctor -v` is 27s and already ran in `check`; the macOS leg
      # only needs to record which toolchain built the binary.
      - name: Report toolchain
        run: flutter --version

      - name: Fetch packages
        run: flutter pub get

      - name: Build iOS (unsigned)
        run: flutter build ios --release --no-codesign

      - name: Package Runner.app into an IPA
        run: |
          set -euo pipefail
          APP="build/ios/iphoneos/Runner.app"
          test -d "$APP" || { echo "::error::$APP was not produced"; exit 1; }

          rm -rf build/ipa
          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry Swayve-unsigned.ipa Payload)

          ls -lh build/ipa/Swayve-unsigned.ipa

      - name: Upload the IPA
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Swayve-unsigned-ipa
          path: build/ipa/Swayve-unsigned.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-build-diagnostics
          path: |
            ios/Podfile.lock
            ios/Flutter/Generated.xcconfig
          if-no-files-found: ignore
          retention-days: 7
