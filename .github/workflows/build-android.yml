name: Build Android APK

# Builds Swayve's Android APKs by checking out the private swayve-client repo.
# Lives here (public) rather than in swayve-client (private) so the build runs
# on free Actions minutes instead of billed ones.
#
# Manual only — trigger after pushing to swayve-client with
#   gh workflow run "Build Android APK" --repo dazacode/swayve-ci -f ref=main
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'swayve-client branch, tag or commit to build'
        required: false
        default: main

# Every build authenticates to swayve-client with SWAYVE_CLIENT_TOKEN, not with
# GITHUB_TOKEN, and writes nothing back to this repo. Declared here so the job's
# authority is a property of the workflow rather than of a repository setting.
permissions:
  contents: read

# One build per ref at a time: re-dispatching supersedes the run already in
# flight instead of double-booking a runner with a superseded commit.
concurrency:
  group: build-android-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out swayve-client
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: dazacode/swayve-client
          token: ${{ secrets.SWAYVE_CLIENT_TOKEN }}
          ref: ${{ inputs.ref }}
          # No step here pushes, so the PAT is not kept in .git/config where
          # everything the build runs afterwards could read it.
          persist-credentials: false

      - name: Set up the JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Report toolchain
        run: |
          flutter --version
          flutter doctor -v

      - name: Fetch packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # flutter_inappwebview_android 1.1.3 -- what `flutter_inappwebview: 6.1.5`
      # resolves to -- still calls `getDefaultProguardFile('proguard-android.txt')`,
      # which AGP 9 removed for including `-dontoptimize`. Gradle fails while
      # merely evaluating that subproject, so the app never gets as far as being
      # compiled, and no amount of configuration on our side is reached.
      #
      # Fixing it in the app's own dependency graph is not currently possible:
      # the first release that asks for `proguard-android-optimize.txt` is
      # 1.2.0-beta.3, and it is only reachable from the 1.4.0-beta platform
      # interface, which fails 61 of swayve-client's tests. Bumping the facade
      # to the 6.2 beta instead pulls in `flutter_inappwebview_linux`, which is
      # what swayve-client@e27bba5 pinned to 6.1.5 to get rid of -- that
      # backend needs a WPE WebKit no mainstream distro packages, and a
      # federated implementation is compiled whether or not any Dart calls it.
      #
      # So the one deprecated filename is rewritten in the throwaway pub cache
      # of this runner, touching nothing in either repository. `-print -quit`
      # takes the first match and the grep afterwards asserts the rewrite
      # actually happened, so this fails loudly if upstream ships a stable
      # 1.2.0 and the path or the string stops matching -- at which point this
      # step should be deleted rather than repaired.
      - name: Patch flutter_inappwebview_android's removed ProGuard API
        run: |
          set -euo pipefail
          gradle_file="$(find "${PUB_CACHE:-$HOME/.pub-cache}"             -path '*/flutter_inappwebview_android-*/android/build.gradle'             -print -quit)"
          if [ -z "$gradle_file" ]; then
            echo "flutter_inappwebview_android is no longer a dependency; delete this step." >&2
            exit 1
          fi
          echo "Patching $gradle_file"
          sed -i "s/getDefaultProguardFile('proguard-android\.txt')/getDefaultProguardFile('proguard-android-optimize.txt')/g" "$gradle_file"
          if grep -q "getDefaultProguardFile('proguard-android\.txt')" "$gradle_file"; then
            echo "The rewrite did not take." >&2
            exit 1
          fi
          grep -n 'getDefaultProguardFile' "$gradle_file"

      - name: Build the APKs
        run: flutter build apk --release --split-per-abi

      - name: Show what was produced
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload the APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Swayve-android-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-build-diagnostics
          path: |
            android/local.properties
            build/app/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
