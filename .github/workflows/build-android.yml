name: Build Android APK

# Builds Swayve's Android APKs by checking out the private swayve-client repo.
# Lives here (public) rather than in swayve-client (private) so the build runs
# on free Actions minutes instead of billed ones.
#
# Manual only — trigger after pushing to swayve-client with
#   gh workflow run "Build Android APK" --repo dazacode/swayve-ci -f ref=main
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'swayve-client branch, tag or commit to build'
        required: false
        default: main

# Every build authenticates to swayve-client with SWAYVE_CLIENT_TOKEN, not with
# GITHUB_TOKEN, and writes nothing back to this repo. Declared here so the job's
# authority is a property of the workflow rather than of a repository setting.
permissions:
  contents: read

# One build per ref at a time: re-dispatching supersedes the run already in
# flight instead of double-booking a runner with a superseded commit.
concurrency:
  group: build-android-${{ inputs.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out swayve-client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dazacode/swayve-client
          token: ${{ secrets.SWAYVE_CLIENT_TOKEN }}
          ref: ${{ inputs.ref }}
          # No step here pushes, so the PAT is not kept in .git/config where
          # everything the build runs afterwards could read it.
          persist-credentials: false

      - name: Set up the JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Report toolchain
        run: |
          flutter --version
          flutter doctor -v

      - name: Fetch packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # flutter_inappwebview_android 1.1.3 -- what `flutter_inappwebview: 6.1.5`
      # resolves to -- still calls `getDefaultProguardFile('proguard-android.txt')`,
      # which AGP 9 removed for including `-dontoptimize`. Gradle fails while
      # merely evaluating that subproject, so the app never gets as far as being
      # compiled, and no amount of configuration on our side is reached.
      #
      # Fixing it in the app's own dependency graph is not currently possible:
      # the first release that asks for `proguard-android-optimize.txt` is
      # 1.2.0-beta.3, and it is only reachable from the 1.4.0-beta platform
      # interface, which fails 61 of swayve-client's tests. Bumping the facade
      # to the 6.2 beta instead pulls in `flutter_inappwebview_linux`, which is
      # what swayve-client@e27bba5 pinned to 6.1.5 to get rid of -- that
      # backend needs a WPE WebKit no mainstream distro packages, and a
      # federated implementation is compiled whether or not any Dart calls it.
      #
      # So the one deprecated filename is rewritten in the throwaway pub cache
      # of this runner, touching nothing in either repository. `-print -quit`
      # takes the first match and the grep afterwards asserts the rewrite
      # actually happened, so this fails loudly if upstream ships a stable
      # 1.2.0 and the path or the string stops matching -- at which point this
      # step should be deleted rather than repaired.
      - name: Patch flutter_inappwebview_android's removed ProGuard API
        run: |
          set -euo pipefail
          patched=0
          while IFS= read -r gradle_file; do
            case "$gradle_file" in */example/*) continue ;; esac
            grep -q "getDefaultProguardFile('proguard-android\.txt')" "$gradle_file" || continue
            echo "Patching $gradle_file"
            sed -i "s/getDefaultProguardFile('proguard-android\.txt')/getDefaultProguardFile('proguard-android-optimize.txt')/g" "$gradle_file"
            patched=$((patched + 1))
          done < <(find "${PUB_CACHE:-$HOME/.pub-cache}" -path '*/flutter_inappwebview_android-*/*build.gradle*' -type f)
          if [ "$patched" -eq 0 ]; then
            echo "Nothing needed patching. If upstream shipped a fixed release, delete this step." >&2
            exit 1
          fi
          echo "Patched $patched file(s)."

      # The release signing key, decoded from repository secrets.
      #
      # Before this existed CI signed every release APK with Gradle's debug
      # key, which is generated per machine — so a fresh runner produced a
      # differently signed APK every single build, and Android refused to
      # install one release over the previous one. Testers had to uninstall
      # first, losing their downloaded music, likes and pairing every time.
      # The in-app updater cannot work without a stable key, so this step is
      # load-bearing rather than a nicety.
      #
      # Hard-fails when the secret is missing. A silent fallback to debug
      # signing is precisely the failure this replaces: it produces a working
      # APK that quietly cannot be installed as an update, and nothing about
      # the build looks wrong.
      - name: Restore the release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set on this repository. See KEYSTORE-README in the keystore folder; without it every build is signed with a throwaway key and cannot be installed as an update."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/swayve-release.jks
          {
            echo "storeFile=swayve-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "Keystore restored ($(stat -c%s android/app/swayve-release.jks) bytes)."

      - name: Build the APKs
        run: flutter build apk --release --split-per-abi

      - name: Show what was produced
        run: ls -lh build/app/outputs/flutter-apk/


      # Proves the key actually reached the APK. `flutter build apk` succeeds
      # just as happily with the debug fallback in build.gradle.kts, so
      # "the build passed" says nothing about whether this release can be
      # installed over the last one.
      - name: Check the APKs carry the release signature
        run: |
          set -euo pipefail
          apksigner="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$apksigner" || { echo "::error::apksigner not found"; exit 1; }
          for apk in build/app/outputs/flutter-apk/*.apk; do
            certs="$("$apksigner" verify --print-certs "$apk")"
            echo "$apk"
            echo "$certs" | grep -iE 'certificate DN|SHA-256 digest' | sed 's/^/  /'
            if echo "$certs" | grep -qi 'CN=Android Debug'; then
              echo "::error::$apk was signed with a debug key — it cannot be installed over an existing Swayve."
              exit 1
            fi
          done
      - name: Upload the APKs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Swayve-android-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-build-diagnostics
          path: |
            android/local.properties
            build/app/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
